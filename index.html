<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Exam Notes | CoderDotPy</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            color: #2b2d42;
        }
        
        .hero-section {
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            color: #ffffff;
            padding: 4rem 0;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
            margin-bottom: 3rem;
        }

        .note-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
        }

        .badge-custom {
            background-color: #e0e7ff;
            color: #4f46e5;
            font-weight: 600;
            padding: 0.5em 1em;
            border-radius: 30px;
            font-size: 0.85rem;
        }

        .highlight {
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3">Computer Exam Notes</h1>
            <p class="lead opacity-75">My digital notebook for definitions, algorithms, and concepts.</p>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <!-- Note 1: Definition of Computer -->
                <div class="note-card mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                        <h2 class="h4 mb-0 fw-bold">What is a Computer?</h2>
                        <span class="badge-custom">Basics</span>
                    </div>
                    <p class="fs-5 text-secondary lh-base mb-0">
                        A <span class="highlight">programmable electronic device</span> designed to accept data, perform prescribed mathematical and logical operations at high speed, and display the results of these operations.
                    </p>
                </div>

                <!-- You can copy and paste the .note-card block above to add more definitions below -->

            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
